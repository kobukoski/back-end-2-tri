<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back-End</title>
    <link rel="icon" type="image/png" href="Império alviverde_.jpeg">
    <style>
        body {
            background-color: lightgreen;
            font-weight: bold;
            background-image: url("Império alviverde_.jpeg");
            background-size: cover;
            background-position: center 25%;
            background-repeat: no-repeat;
            color: white;
            margin: 0;
            padding: 0;
            height: 100vh;
        }
    </style>
    <script>
        function pesquisarCep(){
            const cep = document.getElementById("cep").value

            const validacep = /^[0-9]{8}$/
            if(validacep.test(cep)){

            const link = "https://viacep.com.br/ws/" + cep + "/json/?callback=preencherEndereco"
            var script = document.createElement("script")
            script.src = link
            document.body.appendChild(script)
        }else{
            resposta.textContent = "O CEP foi digitado fora do padrão aceito "
        }
    }
    
        function preencherEndereco(conteudo){
            if ("erro" in conteudo){
                resposta.textContent = "O CEP digitado está incorreto"
                document.getElementById("cep").value = ""
            } else{
                resposta.textContent = JSON.stringify(conteudo)
            }
        }

    </script>
</head>
<body>
    <label>CEP:</label>
    <input type="text" id="cep">
    <button onclick="pesquisarCep()">Enviar</button>
    <p id="resposta"></p>
</body>
</html>
